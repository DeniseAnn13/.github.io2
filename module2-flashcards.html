<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Module 2 Flashcards</title><style>
body{margin:0;font:16px/1.5 Arial,sans-serif;background:#f4f7fb;color:#172033}main{max-width:900px;margin:auto;padding:24px 18px 60px}.toolbar{display:flex;gap:8px;flex-wrap:wrap}button,a{color:#2463a9}.toolbar button{border:1px solid #2463a9;background:#fff;padding:8px 12px;border-radius:7px}.toolbar button.active{background:#2463a9;color:#fff}.card{height:300px;margin:22px 0;background:#fff;border:1px solid #dce5f0;border-radius:14px;display:flex;align-items:center;justify-content:center;text-align:center;padding:32px;font-size:1.25rem;cursor:pointer;box-shadow:0 4px 12px rgba(30,60,100,.08)}.controls{text-align:center}.controls button{background:#2463a9;color:#fff;border:0;border-radius:8px;padding:10px 16px;margin:5px}.label{text-align:center;color:#5e6b7d}.meta{text-align:center}
</style></head><body><main>
<nav><a href="index.html">← Home</a> · <a href="module2-study-center.html">Study center</a> · <a href="module2-practice-test.html">Practice test</a> · <a href="module2-mock-exam.html">Mock exam</a></nav>
<h1>Module 2 Flashcards</h1><div class="toolbar" id="topics"></div><p class="label">Select a topic, then click a card to flip it.</p><div class="card" id="card" onclick="flip()"></div><p class="meta" id="meta"></p><div class="controls"><button onclick="previous()">Previous</button><button onclick="next()">Next</button></div>
<script>
const groups={
Vision:[['Which retinal cells support dim-light vision?','Rods'],['What is the optic chiasm?','Where nasal retinal fibers cross'],['Name the two visual streams.','Ventral (“what”) and dorsal (“where/how”)'],['What is trichromatic theory?','Color depends on relative activity of S, M, and L cones']],
Hearing:[['What amplifies sound in the middle ear?','The ossicles: malleus, incus, and stapes'],['Where does cochlear transduction occur?','The organ of Corti on the basilar membrane'],['What auditory structure helps with interaural differences?','The superior olivary complex']],
TouchPain:[['What fibers carry sharp first pain?','A-delta fibers'],['What fibers carry slow aching pain?','C fibers'],['What does the dorsal column pathway carry?','Fine touch, vibration, and proprioception']],
Chemical:[['Which receptor complexes mediate sweet and umami?','Sweet: T1R2/T1R3; umami: T1R1/T1R3'],['What receptors mediate smell?','G-protein-coupled olfactory receptors']],
Motor:[['What is the cerebellum’s main role?','Timing, accuracy, balance, and motor learning'],['What basal-ganglia change occurs in Parkinson’s?','Loss of substantia nigra dopamine neurons'],['What movement symptoms occur in Huntington’s?','Chorea and later impaired control']],
Regulation:[['What is allostasis?','Maintaining stability through changing responses to anticipated demands'],['What causes osmotic thirst?','Increased concentration of body fluids'],['What causes hypovolemic thirst?','Reduced blood volume or fluid loss']],
Sleep:[['What receptor do benzodiazepines enhance?','GABA-A'],['What do orexin antagonists promote?','Reduced wakefulness and sleep'],['Name one circadian zeitgeber.','Light, with consistent schedules as another example']]
};let topic='Vision',index=0,front=true;
function setup(){const bar=document.getElementById('topics');Object.keys(groups).forEach(k=>{let b=document.createElement('button');b.textContent=k;b.onclick=()=>{topic=k;index=0;front=true;b.active;render();};bar.appendChild(b)});render()}
function render(){document.querySelectorAll('.toolbar button').forEach(b=>b.classList.toggle('active',b.textContent===topic));const pair=groups[topic][index];document.getElementById('card').textContent=front?pair[0]:pair[1];document.getElementById('meta').textContent=topic+' • '+(index+1)+' of '+groups[topic].length}function flip(){front=!front;render()}function next(){index=(index+1)%groups[topic].length;front=true;render()}function previous(){index=(index-1+groups[topic].length)%groups[topic].length;front=true;render()}setup();
</script></main></body></html>
